syntax = "proto3";
package user;
option go_package = "rebound-chat/microservices/proto/user;userpb";

service UserService {
  rpc Register(RegisterRequest) returns (AuthResponse);
  rpc Login(LoginRequest) returns (AuthResponse);
  rpc GetProfile(ProfileRequest) returns (ProfileResponse);
}

message RegisterRequest {
  string username = 1;
  string email = 2;
  string display_name = 3;
  string bio = 4;
  string password = 5;
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message ProfileRequest {
  string id = 1;
  string token = 2;
}

message AuthResponse {
  string user_id = 1;
  string token = 2;
}

message ProfileResponse {
  string user_id = 1;
  string username = 2;
  string display_name = 3;
  string bio = 4;
}
