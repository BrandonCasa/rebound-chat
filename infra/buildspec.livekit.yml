version: 0.2

env:
  shell: bash

phases:
  pre_build:
    commands:
      - test -f infra/local/livekit/livekit.yaml
      - IMAGE_TAG="${CODEBUILD_RESOLVED_SOURCE_VERSION:-local}"
      - IMAGE_TAG="${IMAGE_TAG:0:12}"
      - echo "Building LiveKit image ${IMAGE_REPOSITORY_URI}:${IMAGE_TAG}"
  build:
    commands:
      - docker build -f infra/docker/livekit.Dockerfile -t "${IMAGE_REPOSITORY_URI}:${IMAGE_TAG}" .
  post_build:
    commands:
      - |
        if [ "${DRY_RUN:-true}" = "true" ]; then
          echo "DRY_RUN=true; skipping ECR login and LiveKit image push."
        else
          aws ecr get-login-password --region "${AWS_REGION}" | docker login --username AWS --password-stdin "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          docker push "${IMAGE_REPOSITORY_URI}:${IMAGE_TAG}"
        fi
