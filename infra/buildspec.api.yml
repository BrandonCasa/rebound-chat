version: 0.2

env:
  shell: bash

phases:
  install:
    runtime-versions:
      nodejs: 22
    commands:
      - corepack enable && corepack prepare pnpm@10.32.1 --activate
      - pnpm install --frozen-lockfile
  pre_build:
    commands:
      - pnpm --prefix server test
      - IMAGE_TAG="${CODEBUILD_RESOLVED_SOURCE_VERSION:-local}"
      - IMAGE_TAG="${IMAGE_TAG:0:12}"
      - echo "Building API image ${IMAGE_REPOSITORY_URI}:${IMAGE_TAG}"
  build:
    commands:
      - docker build -f infra/docker/api.Dockerfile -t "${IMAGE_REPOSITORY_URI}:${IMAGE_TAG}" .
  post_build:
    commands:
      - |
        if [ "${DRY_RUN:-true}" = "true" ]; then
          echo "DRY_RUN=true; skipping ECR login and API image push."
        else
          aws ecr get-login-password --region "${AWS_REGION}" | docker login --username AWS --password-stdin "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          docker push "${IMAGE_REPOSITORY_URI}:${IMAGE_TAG}"
        fi
