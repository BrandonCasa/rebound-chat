name: Build and Dist

on:
  workflow_dispatch:
    inputs:
      bumpVersion:
        description: "Whether to bump the version in package.json files"
        required: false
        default: "false"
      build_windows_11:
        description: "Build for Windows 11 (set to 'true' to enable)"
        required: false
        default: "false"
      build_macos_arm:
        description: "Build for macOS ARM (set to 'true' to enable)"
        required: false
        default: "false"
      build_macos_intel:
        description: "Build for macOS Intel (set to 'true' to enable)"
        required: false
        default: "false"
      build_linux:
        description: "Build for Linux (set to 'true' to enable)"
        required: false
        default: "false"

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0 # Ensure full history for version bumping
      - name: Bump version in package.json files
        if: ${{ github.event.inputs.bumpVersion == 'true' }}
        run: |
          echo "Bumping version in package.json"
          # Bump version in the root package.json (patch version) without creating a git tag
          npm version patch --no-git-tag-version
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "New version: $NEW_VERSION"
          # Update the version in server/package.json to match the new version
          jq --arg v "$NEW_VERSION" '.version = $v' server/package.json > server/package.tmp && mv server/package.tmp server/package.json
          # Configure git and commit the changes
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add package.json server/package.json
          git commit -m "Bump version to $NEW_VERSION [skip ci]" || echo "No changes to commit"
          git push origin HEAD:${{ github.ref }}

  set-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Generate matrix
        id: set-matrix
        run: |
          # Initialize an empty JSON structure for the matrix
          MATRIX="{\"include\": []}"
          echo "Initial matrix: $MATRIX"

          # Conditionally add platforms based on workflow inputs
          if [ "${{ github.event.inputs.build_windows_11 }}" = "true" ]; then
            MATRIX=$(echo "$MATRIX" | jq '.include += [{"os": "windows-latest", "builderFlag": "--win", "archFlag": "", "platform": "Windows 11"}]')
          fi
          if [ "${{ github.event.inputs.build_macos_intel }}" = "true" ]; then
            MATRIX=$(echo "$MATRIX" | jq '.include += [{"os": "macos-latest", "builderFlag": "--mac", "archFlag": "--x64", "platform": "macOS Intel"}]')
          fi
          if [ "${{ github.event.inputs.build_macos_arm }}" = "true" ]; then
            MATRIX=$(echo "$MATRIX" | jq '.include += [{"os": "macos-latest", "builderFlag": "--mac", "archFlag": "--arm64", "platform": "macOS ARM"}]')
          fi
          if [ "${{ github.event.inputs.build_linux }}" = "true" ]; then
            MATRIX=$(echo "$MATRIX" | jq '.include += [{"os": "ubuntu-latest", "builderFlag": "--linux", "archFlag": "", "platform": "Linux"}]')
          fi
          echo "Final matrix: $MATRIX"
          # Output the matrix JSON for use by other jobs using multiline syntax
          echo "matrix<<EOF" >> $GITHUB_OUTPUT
          echo "$MATRIX" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

  build:
    needs: [version, set-matrix]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix: ${{ fromJson(needs.set-matrix.outputs.matrix) }}
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18.x"
      - name: Install Dependencies
        run: npm ci --ignore-scripts
      - name: Linter
        run: eslint . --fix
      - name: Run Build Command
        run: npm run build
        env:
          PUBLIC_URL: "."
      - name: Run Dist Command for ${{ matrix.platform }}
        run: npm run dist -- ${{ matrix.builderFlag }} ${{ matrix.archFlag }} --publish always
