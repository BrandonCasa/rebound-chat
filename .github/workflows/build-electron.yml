name: Build and Dist

run-name: Electron dist — ${{ github.ref_name }}${{ inputs.bumpVersion && ' · bump' || '' }}

on:
  workflow_dispatch:
    inputs:
      bumpVersion:
        description: Patch-bump the root and server package.json, commit, and push before building
        type: boolean
        default: false
      build_windows_11:
        description: Windows — NSIS installer (x64)
        type: boolean
        default: true
      build_macos_arm:
        description: macOS — Apple silicon (arm64)
        type: boolean
        default: true
      build_macos_intel:
        description: macOS — Intel (x64)
        type: boolean
        default: false
      build_linux:
        description: Linux — AppImage (x64)
        type: boolean
        default: true

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.8
        with:
          version: 10
          run_install: false

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 22.x

      - name: Bump version in package.json files
        if: ${{ inputs.bumpVersion }}
        run: |
          echo "Bumping version in package.json"
          pnpm version patch --no-git-tag-version
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "New version: $NEW_VERSION"
          jq --arg v "$NEW_VERSION" '.version = $v' server/package.json > server/package.tmp && mv server/package.tmp server/package.json
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add package.json server/package.json
          git commit -m "Bump version to $NEW_VERSION [skip ci]" || echo "No changes to commit"
          git push origin HEAD:${{ github.ref }}

  set-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Generate matrix
        id: set-matrix
        run: |
          if [ "${{ inputs.build_windows_11 }}" != "true" ] \
            && [ "${{ inputs.build_macos_intel }}" != "true" ] \
            && [ "${{ inputs.build_macos_arm }}" != "true" ] \
            && [ "${{ inputs.build_linux }}" != "true" ]; then
            echo "::error title=No targets selected::Choose at least one platform. All checkboxes were left off."
            exit 1
          fi

          MATRIX="{\"include\": []}"
          echo "Initial matrix: $MATRIX"

          if [ "${{ inputs.build_windows_11 }}" = "true" ]; then
            MATRIX=$(echo "$MATRIX" | jq '.include += [{"os": "windows-latest", "builderFlag": "--win", "archFlag": "", "platform": "Windows 11", "ffmpegArch": ""}]')
          fi
          if [ "${{ inputs.build_macos_intel }}" = "true" ]; then
            MATRIX=$(echo "$MATRIX" | jq '.include += [{"os": "macos-latest", "builderFlag": "--mac", "archFlag": "--x64", "platform": "macOS Intel", "ffmpegArch": "x64"}]')
          fi
          if [ "${{ inputs.build_macos_arm }}" = "true" ]; then
            MATRIX=$(echo "$MATRIX" | jq '.include += [{"os": "macos-latest", "builderFlag": "--mac", "archFlag": "--arm64", "platform": "macOS ARM", "ffmpegArch": "arm64"}]')
          fi
          if [ "${{ inputs.build_linux }}" = "true" ]; then
            MATRIX=$(echo "$MATRIX" | jq '.include += [{"os": "ubuntu-latest", "builderFlag": "--linux", "archFlag": "", "platform": "Linux", "ffmpegArch": ""}]')
          fi
          echo "Final matrix: $MATRIX"
          # Output the matrix JSON for use by other jobs using multiline syntax
          echo "matrix<<EOF" >> $GITHUB_OUTPUT
          echo "$MATRIX" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

  build:
    needs: [version, set-matrix]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix: ${{ fromJson(needs.set-matrix.outputs.matrix) }}
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      FFMPEG_ARCH: ${{ matrix.ffmpegArch }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2

      - name: Cache bundled FFmpeg
        uses: actions/cache@v5.0.5
        with:
          path: native/ffmpeg
          key: ffmpeg-${{ matrix.platform }}-${{ hashFiles('projectscripts/fetch-ffmpeg.js') }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.8
        with:
          version: 10
          run_install: false

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 22.x

      - name: Install Packages, Build App, Dist for ${{ matrix.platform }}
        run: |
          pnpm install --no-frozen-lockfile
          pnpm run build
          pnpm run dist ${{ matrix.builderFlag }} ${{ matrix.archFlag }} --publish always
