name: CDK Deploy Dev

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy-dev:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.5
        with:
          version: 10
          run_install: false

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 22.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.REBOUND_DEV_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: us-east-2

      - name: Build CDK package
        run: pnpm --filter rebound-cdk build

      - name: Run CDK tests
        run: pnpm --filter rebound-cdk test

      - name: Synthesize dev stacks
        run: pnpm --filter rebound-cdk synth:dev

      - name: Deploy dev stacks
        run: pnpm --filter rebound-cdk deploy:dev
