name: Deploy to AWS Ubuntu Server

on:
  workflow_dispatch:
    inputs:
      appDirectory:
        description: "Application directory path"
        required: false
        default: "/home/ubuntu/Rebound/Full"
      tmpDirectory:
        description: "Temporary directory path"
        required: false
        default: "/home/ubuntu/tmp"
      nginxConfig:
        description: "Nginx config file path"
        required: false
        default: "/etc/nginx/sites-enabled/default"
      repositoryURL:
        description: "The HTTPS .git URL for the repository"
        required: false
        default: "https://github.com/BrandonCasa/rebound-chat.git"
      serverSubdirectory:
        description: "The path of the server directory within the repository"
        required: false
        default: "server"
      pm2ProcessName:
        description: "The name of PM2 Process to be restarted"
        required: false
        default: "rebound-express"
      deploymentBranch:
        description: "The branch to deploy from the repository"
        required: false
        default: "dev"
      bumpVersion:
        description: "Whether to bump the version in package.json files"
        required: false
        default: "false"

env:
  AWS_ACCESS_KEY: ${{ secrets.AWS_ACCESS_KEY }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  EC2_INSTANCE_IP: ${{ secrets.EC2_INSTANCE_IP }}
  SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
  SECRET: ${{ secrets.SECRET }}
  ACCESS_TOKEN_SECRET: ${{ secrets.ACCESS_TOKEN_SECRET }}
  REFRESH_TOKEN_SECRET: ${{ secrets.REFRESH_TOKEN_SECRET }}
  DB_USER: ${{ secrets.DB_USER }}
  DB_PASS: ${{ secrets.DB_PASS }}
  DB_AUTH: ${{ secrets.DB_AUTH }}
  DB_NAME: ${{ secrets.DB_NAME }}
  PORT: ${{ secrets.PORT }}
  GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
  GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
  LIVE_INGEST_CREATE_TOKEN: ${{ secrets.LIVE_INGEST_CREATE_TOKEN }}
  LIVE_STORAGE_BACKEND: ${{ secrets.LIVE_STORAGE_BACKEND }}
  LIVE_STORAGE_DIR: ${{ secrets.LIVE_STORAGE_DIR }}
  LIVE_SESSION_TTL_MS: ${{ secrets.LIVE_SESSION_TTL_MS }}
  LIVE_HEARTBEAT_INTERVAL_MS: ${{ secrets.LIVE_HEARTBEAT_INTERVAL_MS }}
  LIVE_MAX_RETAINED_SEGMENTS: ${{ secrets.LIVE_MAX_RETAINED_SEGMENTS }}
  LIVE_MAX_SEGMENT_BYTES: ${{ secrets.LIVE_MAX_SEGMENT_BYTES }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.5
        with:
          version: 10
          run_install: false

      - name: Cache pnpm modules
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          
      - name: Setup Node.js 22.x
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 22.x
          cache: "pnpm"

      - name: Bump version in package.json files
        if: ${{ github.event.inputs.bumpVersion == 'true' }}
        run: |
          echo "Bumping version in package.json"
          pnpm version patch --no-git-tag-version
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "New version: $NEW_VERSION"
          jq --arg v "$NEW_VERSION" '.version = $v' server/package.json > server/package.tmp && mv server/package.tmp server/package.json
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add package.json server/package.json
          git commit -m "Bump version to $NEW_VERSION [skip ci]" || echo "No changes to commit"
          git push origin HEAD:${{ github.ref }}
          
      - name: Checkout code
        uses: actions/checkout@v6.0.2

      - name: Install Packages and Build App
        run: |
          pnpm install --no-frozen-lockfile
          pnpm run build
        env:
          CI: false

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -t rsa ${{ secrets.EC2_INSTANCE_IP }} >> ~/.ssh/known_hosts

      - name: Ensure Temporary Directory Exists and is Empty on Server
        run: |
          ssh ubuntu@${{ secrets.EC2_INSTANCE_IP }} "mkdir -p ${{ github.event.inputs.tmpDirectory }} && rm -rf ${{ github.event.inputs.tmpDirectory }}/*"

      - name: Transfer build to Server
        run: |
          tar czf build.tar.gz -C build .
          scp build.tar.gz ubuntu@${{ secrets.EC2_INSTANCE_IP }}:${{ github.event.inputs.tmpDirectory }}
          ssh ubuntu@${{ secrets.EC2_INSTANCE_IP }} "sudo tar xzf ${{ github.event.inputs.tmpDirectory }}/build.tar.gz -C /var/www/html && rm ${{ github.event.inputs.tmpDirectory }}/build.tar.gz"

      - name: Setup Server and Deploy
        run: |
          ssh ubuntu@${{ secrets.EC2_INSTANCE_IP }} << EOF
            set -e
            NEW_CLONE=false

            mkdir -p "${{ github.event.inputs.appDirectory }}"
            if [ -d "${{ github.event.inputs.appDirectory }}/.git" ]; then
              cd "${{ github.event.inputs.appDirectory }}"
              CURRENT_URL=$(git config --get remote.origin.url || echo "")
              if [ "${CURRENT_URL}" = "${{ github.event.inputs.repositoryURL }}" ]; then
                if [ -n "$(git status --porcelain)" ]; then
                  git restore .
                  git clean -fd
                fi
                git fetch origin "${{ github.event.inputs.deploymentBranch }}"
                if git rev-parse --verify "${{ github.event.inputs.deploymentBranch }}" >/dev/null 2>&1; then
                  git checkout "${{ github.event.inputs.deploymentBranch }}"
                else
                  git checkout -b "${{ github.event.inputs.deploymentBranch }}" "origin/${{ github.event.inputs.deploymentBranch }}"
                fi
                git reset --hard "origin/${{ github.event.inputs.deploymentBranch }}"
              else
                cd ..
                rm -rf "${{ github.event.inputs.appDirectory }}"
                git clone "${{ github.event.inputs.repositoryURL }}" "${{ github.event.inputs.appDirectory }}"
                NEW_CLONE=true
                cd "${{ github.event.inputs.appDirectory }}"
              fi
            else
              rm -rf "${{ github.event.inputs.appDirectory }}"
              git clone "${{ github.event.inputs.repositoryURL }}" "${{ github.event.inputs.appDirectory }}"
              NEW_CLONE=true
              cd "${{ github.event.inputs.appDirectory }}"
            fi

            git fetch origin "${{ github.event.inputs.deploymentBranch }}"
            if git rev-parse --verify "${{ github.event.inputs.deploymentBranch }}" >/dev/null 2>&1; then
              git checkout "${{ github.event.inputs.deploymentBranch }}"
            else
              git checkout -b "${{ github.event.inputs.deploymentBranch }}" "origin/${{ github.event.inputs.deploymentBranch }}"
            fi
            git reset --hard "origin/${{ github.event.inputs.deploymentBranch }}"

            cd "${{ github.event.inputs.serverSubdirectory }}"

            echo -e "SECRET=${{ secrets.SECRET }}\nACCESS_TOKEN_SECRET=${{ secrets.ACCESS_TOKEN_SECRET }}\nREFRESH_TOKEN_SECRET=${{ secrets.REFRESH_TOKEN_SECRET }}\nDB_USER=${{ secrets.DB_USER }}\nDB_PASS=${{ secrets.DB_PASS }}\nDB_AUTH=${{ secrets.DB_AUTH }}\nDB_NAME=${{ secrets.DB_NAME }}\nPORT=${{ secrets.PORT }}\nGOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}\nGOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}\nLIVE_INGEST_CREATE_TOKEN=${{ secrets.LIVE_INGEST_CREATE_TOKEN }}\nLIVE_STORAGE_BACKEND=${{ secrets.LIVE_STORAGE_BACKEND }}\nLIVE_STORAGE_DIR=${{ secrets.LIVE_STORAGE_DIR }}\nLIVE_SESSION_TTL_MS=${{ secrets.LIVE_SESSION_TTL_MS }}\nLIVE_HEARTBEAT_INTERVAL_MS=${{ secrets.LIVE_HEARTBEAT_INTERVAL_MS }}\nLIVE_MAX_RETAINED_SEGMENTS=${{ secrets.LIVE_MAX_RETAINED_SEGMENTS }}\nLIVE_MAX_SEGMENT_BYTES=${{ secrets.LIVE_MAX_SEGMENT_BYTES }}" > .env

            pnpm install --frozen-lockfile --ignore-scripts

            pm2 delete ecosystem.config.cjs
            pm2 start ecosystem.config.cjs
            pm2 save --force

            if ! cmp -s "${{ github.event.inputs.nginxConfig }}" "${{ github.event.inputs.appDirectory }}/${{ github.event.inputs.serverSubdirectory }}/nginx/default"; then
              sudo cp "${{ github.event.inputs.appDirectory }}/${{ github.event.inputs.serverSubdirectory }}/nginx/default" "${{ github.event.inputs.nginxConfig }}"
              sudo systemctl restart nginx
            fi
          EOF
