syntax = "proto3";

option go_package = "github.com/BrandonCasa/rebound-chat;gateway_service";

service GatewayService {
  rpc InboundRequest (InboundCall) returns (OutboundResponse) {}
}

message InboundCall {
	string method = 1;
	string path = 2;
	map<string, string> headers = 3;
	string body = 4;
}

message OutboundResponse {
	int32 status = 1;
	string body = 2;
	map<string, string> headers = 3;
}